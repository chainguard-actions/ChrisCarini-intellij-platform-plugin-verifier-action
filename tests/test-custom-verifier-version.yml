name: Test custom verifier version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal fake plugin zip file
      - name: Create fake plugin zip
        run: |
          mkdir -p build/distributions
          mkdir -p fake-plugin/META-INF
          cat > fake-plugin/META-INF/plugin.xml <<'EOF'
          <idea-plugin>
            <id>com.example.fake</id>
            <name>Fake Plugin</name>
            <version>1.0.0</version>
            <vendor>Test</vendor>
            <description>A fake plugin for testing</description>
            <idea-version since-build="203"/>
          </idea-plugin>
          EOF
          cd fake-plugin && zip -r ../build/distributions/fake-plugin-1.0.0.zip . && cd ..
          echo "Created fake plugin zip:"
          ls -la build/distributions/

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Use a specific known verifier version instead of LATEST
          verifier-version: '1.307'
          plugin-location: 'build/distributions/fake-plugin-*.zip'
          ide-versions: |
            ideaIC:2023.1
          failure-levels: 'COMPATIBILITY_PROBLEMS'

      - name: Assert output log filename is set
        env:
          LOG_FILE: ${{ steps.action.outputs.verification-output-log-filename }}
        run: |
          echo "verification-output-log-filename: $LOG_FILE"
          if [ -z "$LOG_FILE" ]; then
            echo "FAIL: expected verification-output-log-filename to be set"
            exit 1
          fi
          echo "PASS: output log filename is set to '$LOG_FILE'"
