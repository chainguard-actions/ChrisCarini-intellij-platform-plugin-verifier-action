name: Test basic usage - output filename set
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal valid IntelliJ plugin ZIP for testing
      - name: Create minimal plugin ZIP fixture
        run: |
          mkdir -p /tmp/plugin-build/META-INF
          cat > /tmp/plugin-build/META-INF/plugin.xml <<'EOF'
          <idea-plugin>
            <id>com.example.test-plugin</id>
            <name>Test Plugin</name>
            <version>1.0.0</version>
            <vendor>Test Vendor</vendor>
            <description>A minimal test plugin for CI testing.</description>
            <idea-version since-build="223"/>
            <depends>com.intellij.modules.platform</depends>
          </idea-plugin>
          EOF
          cd /tmp/plugin-build
          zip -r /tmp/test-plugin.zip META-INF/
          mkdir -p "$GITHUB_WORKSPACE/build/distributions"
          cp /tmp/test-plugin.zip "$GITHUB_WORKSPACE/build/distributions/test-plugin-1.0.0.zip"
          echo "Plugin ZIP created at: $GITHUB_WORKSPACE/build/distributions/test-plugin-1.0.0.zip"
          ls -lh "$GITHUB_WORKSPACE/build/distributions/"

      - id: action
        uses: .
        with:
          verifier-version: '1.307'
          plugin-location: 'build/distributions/test-plugin-1.0.0.zip'
          ide-versions: 'ideaIC:2022.3.3'
          failure-levels: 'INVALID_PLUGIN'
        continue-on-error: true

      - name: Assert output filename is set
        env:
          ACTUAL: ${{ steps.action.outputs.verification-output-log-filename }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected verification-output-log-filename to be set"
            exit 1
          fi
          echo "PASS: verification-output-log-filename is set to '$ACTUAL'"

      - name: Assert output filename value
        env:
          ACTUAL: ${{ steps.action.outputs.verification-output-log-filename }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "verification_result.log" ]; then
            echo "FAIL: expected 'verification_result.log' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: output filename is 'verification_result.log'"
