name: Test default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal fake plugin zip inside the workspace (plugin-location is relative to GITHUB_WORKSPACE)
      - name: Create fake plugin zip in workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/distributions"
          mkdir -p /tmp/fake-plugin-src
          echo "not a real plugin" > /tmp/fake-plugin-src/README.txt
          cd /tmp/fake-plugin-src
          zip -r "$GITHUB_WORKSPACE/build/distributions/fake-plugin.zip" .
          echo "Created fake plugin zip:"
          ls -la "$GITHUB_WORKSPACE/build/distributions/fake-plugin.zip"

      # Run with default failure-levels (COMPATIBILITY_PROBLEMS INVALID_PLUGIN)
      # The fake plugin will trigger INVALID_PLUGIN, so the action should fail
      - id: action
        uses: .
        continue-on-error: true
        with:
          verifier-version: 'LATEST'
          plugin-location: 'build/distributions/fake-plugin.zip'
          ide-versions: |
            ideaIC:2023.1

      - name: Assert action ran (failed due to invalid plugin with default failure levels)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          LOG_FILE: ${{ steps.action.outputs.verification-output-log-filename }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "verification-output-log-filename: $LOG_FILE"
          # With default failure-levels (COMPATIBILITY_PROBLEMS INVALID_PLUGIN),
          # the action should fail because the fake zip is not a valid plugin
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with default failure levels and invalid plugin"
            exit 1
          fi
          echo "PASS: action correctly failed with default failure levels"
