name: Test duplicate IDE versions detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up a git origin reachable inside the Docker container
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      # The action checks for duplicate IDE versions before downloading anything.
      # This test verifies that the action fails fast (exit code 64) when duplicate
      # IDE versions are provided, without requiring any network downloads.
      - id: action
        uses: .
        continue-on-error: true
        with:
          verifier-version: 'LATEST'
          plugin-location: 'build/distributions/test-plugin.zip'
          ide-versions: |
            ideaIC:2023.1
            ideaIC:2023.1
          failure-levels: 'COMPATIBILITY_PROBLEMS INVALID_PLUGIN'

      - name: Assert action failed due to duplicate IDE versions
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to duplicate IDE versions, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed due to duplicate IDE versions"
