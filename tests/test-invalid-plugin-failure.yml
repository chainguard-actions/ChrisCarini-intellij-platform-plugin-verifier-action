name: Test INVALID_PLUGIN failure level causes action to fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal fake plugin zip file (not a valid IntelliJ plugin)
      - name: Create fake plugin zip
        run: |
          mkdir -p build/distributions
          # Create a zip that is NOT a valid IntelliJ plugin (no plugin.xml in META-INF)
          echo "not a real plugin" > fake-content.txt
          zip build/distributions/fake-plugin-1.0.0.zip fake-content.txt
          echo "Created fake plugin zip:"
          ls -la build/distributions/

      - id: action
        uses: .
        continue-on-error: true
        with:
          verifier-version: 'LATEST'
          plugin-location: 'build/distributions/fake-plugin-*.zip'
          ide-versions: |
            ideaIC:2023.1
          # Include INVALID_PLUGIN - this should cause the action to fail on our fake plugin
          failure-levels: 'INVALID_PLUGIN'

      - name: Assert action failed due to invalid plugin
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with INVALID_PLUGIN, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed due to INVALID_PLUGIN failure level"
