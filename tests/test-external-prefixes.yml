name: Test external-prefixes input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up a git origin reachable inside the Docker container
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      # Create a minimal valid IntelliJ plugin ZIP fixture
      - name: Create minimal plugin ZIP fixture
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/plugin/META-INF"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/plugin/META-INF/plugin.xml" << 'EOF'
          <idea-plugin>
            <id>com.example.test-plugin</id>
            <name>Test Plugin</name>
            <version>1.0.0</version>
            <vendor>Test Vendor</vendor>
            <description>A minimal test plugin for CI verification.</description>
            <idea-version since-build="231"/>
          </idea-plugin>
          EOF
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/plugin/lib"
          mkdir -p /tmp/plugin-jar-contents/META-INF
          cat > /tmp/plugin-jar-contents/META-INF/MANIFEST.MF << 'EOF'
          Manifest-Version: 1.0
          EOF
          cd /tmp/plugin-jar-contents && zip -r /tmp/test-plugin.jar META-INF/
          cp /tmp/test-plugin.jar "$GITHUB_WORKSPACE/tests/fixtures/plugin/lib/test-plugin.jar"
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/dist"
          cd "$GITHUB_WORKSPACE/tests/fixtures/plugin" && zip -r "$GITHUB_WORKSPACE/tests/fixtures/dist/test-plugin-1.0.0.zip" .
          echo "Plugin ZIP created:"
          ls -lh "$GITHUB_WORKSPACE/tests/fixtures/dist/"

      - id: action
        uses: .
        continue-on-error: true
        with:
          verifier-version: '1.307'
          plugin-location: 'tests/fixtures/dist/test-plugin-1.0.0.zip'
          ide-versions: |
            ideaIC:2023.1
          failure-levels: 'COMPATIBILITY_PROBLEMS INVALID_PLUGIN'
          external-prefixes: 'org.example:com.example'

      - name: Assert output log filename is set
        env:
          ACTUAL: ${{ steps.action.outputs.verification-output-log-filename }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected verification-output-log-filename to be set but got empty"
            exit 1
          fi
          if [ "$ACTUAL" != "verification_result.log" ]; then
            echo "FAIL: expected 'verification_result.log' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: verification-output-log-filename is '$ACTUAL' (external-prefixes accepted)"
