name: Test action fails on invalid plugin
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal fake plugin zip inside the workspace (plugin-location is relative to GITHUB_WORKSPACE)
      - name: Create fake plugin zip in workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/distributions"
          mkdir -p /tmp/fake-plugin-src
          echo "not a real plugin" > /tmp/fake-plugin-src/README.txt
          cd /tmp/fake-plugin-src
          zip -r "$GITHUB_WORKSPACE/build/distributions/fake-plugin.zip" .
          echo "Created fake plugin zip:"
          ls -la "$GITHUB_WORKSPACE/build/distributions/fake-plugin.zip"

      - id: action
        uses: .
        continue-on-error: true
        with:
          verifier-version: 'LATEST'
          plugin-location: 'build/distributions/fake-plugin.zip'
          ide-versions: |
            ideaIC:2023.1
          failure-levels: 'INVALID_PLUGIN'

      - name: Assert action failed due to invalid plugin
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid plugin, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid plugin"
